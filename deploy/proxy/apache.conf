# /etc/apache2/sites-available/rts.thewanderingowl.net.conf
# Needs: a2enmod proxy proxy_http headers ; a2ensite rts.thewanderingowl.net
# HTTPS: certbot --apache -d rts.thewanderingowl.net
<VirtualHost *:80>
    ServerName rts.thewanderingowl.net
    LimitRequestBody 13631488
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        / http://127.0.0.1:3070/
    ProxyPassReverse / http://127.0.0.1:3070/
</VirtualHost>
