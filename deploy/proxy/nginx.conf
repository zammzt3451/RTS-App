# /etc/nginx/sites-available/rts.thewanderingowl.net
# Enable: ln -s ../sites-available/rts.thewanderingowl.net /etc/nginx/sites-enabled/
# HTTPS:  certbot --nginx -d rts.thewanderingowl.net
server {
    listen 80;
    listen [::]:80;
    server_name rts.thewanderingowl.net;

    client_max_body_size 13m;

    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
