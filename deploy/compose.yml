# RTS-App behind an existing web server (nginx / Caddy / Apache / Traefik).
# The app listens only on localhost; your existing proxy handles HTTPS for
# rts.thewanderingowl.net and forwards to it. Your other sites are untouched.
#
#   cd deploy && cp .env.example .env && docker compose up -d --build
name: rts
services:
  app:
    build: ..
    container_name: rts-app
    restart: unless-stopped
    user: "${RTS_UID:-1000}:${RTS_GID:-1000}"
    environment:
      - TRUST_PROXY=true
      - COOKIE_SECURE=true
      - SETUP_CODE=${SETUP_CODE:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
    volumes:
      - ${RTS_DATA_DIR:-./data}:/data
    ports:
      - "127.0.0.1:${RTS_PORT:-3070}:3000"
